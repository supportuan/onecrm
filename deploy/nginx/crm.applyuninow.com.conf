# OneCRM — https://crm.applyuninow.com
# Install: sudo cp deploy/nginx/crm.applyuninow.com.conf /etc/nginx/sites-available/
#          sudo ln -sf /etc/nginx/sites-available/crm.applyuninow.com.conf /etc/nginx/sites-enabled/
# SSL:     sudo certbot --nginx -d crm.applyuninow.com
# Reload:  sudo nginx -t && sudo systemctl reload nginx
#
# Point DNS A record: crm.applyuninow.com → your server IP
# Docker app listens on FRONTEND_PORT (default 3000, prod often 3069)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream onecrm_app {
    server 127.0.0.1:3069;
    keepalive 32;
}

upstream onecrm_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.applyuninow.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.applyuninow.com;

    # certbot fills these paths after: certbot --nginx -d crm.applyuninow.com
    ssl_certificate     /etc/letsencrypt/live/crm.applyuninow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.applyuninow.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    # WebSocket — communication module
    location /ws/ {
        proxy_pass http://onecrm_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Next.js app (proxies /api and /uploads to backend inside the container)
    location / {
        proxy_pass http://onecrm_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
