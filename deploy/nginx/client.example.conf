# OneCRM — per-client HTTPS site
# Copy this file, then replace:
#   CLIENT_HOST      e.g. crm.client-b.example
#   CLIENT_SLUG      e.g. client_b  (nginx upstream names must be unique on the host)
#   FRONTEND_PORT    published container port (see deploy/compose/<slug>.env)
#   BACKEND_PORT     published API/websocket port
#
# Install:
#   sudo cp deploy/nginx/client.example.conf /etc/nginx/sites-available/CLIENT_HOST.conf
#   sudo ln -sf /etc/nginx/sites-available/CLIENT_HOST.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d CLIENT_HOST
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream onecrm_CLIENT_SLUG_app {
    server 127.0.0.1:FRONTEND_PORT;
    keepalive 32;
}

upstream onecrm_CLIENT_SLUG_api {
    server 127.0.0.1:BACKEND_PORT;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name CLIENT_HOST;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name CLIENT_HOST;

    ssl_certificate     /etc/letsencrypt/live/CLIENT_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CLIENT_HOST/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    location /ws/ {
        proxy_pass http://onecrm_CLIENT_SLUG_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://onecrm_CLIENT_SLUG_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
