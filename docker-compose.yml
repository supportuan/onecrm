# One CRM — one image, one container per client copy. Secrets stay in that
# client's env file (never commit). Isolation = separate Compose project + env.
#
#   cp Backend/.env.production.example deploy/clients/aun.env   # fill values
#   docker compose --env-file deploy/compose/aun.env up -d --build
#
# See deploy/CLIENTS.md for the four-client checklist.

services:
  onecrm:
    build:
      context: .
      args:
        BACKEND_INTERNAL_URL: http://127.0.0.1:4000
    image: ${IMAGE_NAME:-onecrm}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-onecrm}
    env_file:
      - ${ENV_FILE:-./Backend/.env}
    environment:
      NODE_ENV: production
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      BACKEND_PORT: ${BACKEND_PORT:-4000}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      # Public app port; /api proxied inside container. Backend exposed for host nginx /ws/.
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    restart: unless-stopped
